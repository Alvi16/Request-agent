packages:
  - "apps/*"
  - "packages/*"

# Every dependency version is declared once in the catalog and shared by all packages.
catalogMode: strict
saveExact: true
engineStrict: true

# Dependencies allowed to run install scripts, after review.
allowBuilds:
  esbuild: true

catalog:
  "@mastra/core": 1.79.0
  "@types/node": 26.6.5
  mastra: 1.35.0
  oxlint: 1.89.0
  oxlint-tsgolint: 7.0.2005
  prettier: 3.9.10
  typescript: 7.0.2
  zod: 4.6.7
