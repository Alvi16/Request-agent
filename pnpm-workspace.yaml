packages:
  - "apps/*"
  - "packages/*"

# Every dependency version is declared once in the catalog and shared by all packages.
catalogMode: strict
saveExact: true
engineStrict: true

# Dependencies allowed to run install scripts, after review.
allowBuilds:
  esbuild: true

catalog:
  "@hono/node-server": 2.1.5
  "@mastra/core": 1.79.0
  "@slack/socket-mode": 3.1.0
  "@slack/web-api": 8.2.0
  "@types/node": 26.6.5
  "@types/pg": 8.23.1
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  email-reply-parser: 2.3.9
  hono: 4.13.14
  imapflow: 2.9.1
  mastra: 1.35.0
  nodemailer: 10.2.1
  ollama-ai-provider-v2: 4.1.0
  oxlint: 1.89.0
  oxlint-tsgolint: 7.0.2005
  pg: 8.23.1
  postal-mime: 4.1.4
  prettier: 3.9.10
  typescript: 7.0.2
  vitest: 4.1.12
  zod: 4.6.7

overrides:
  # drizzle-kit declares @esbuild-kit/esm-loader but never loads it. Its esbuild 0.18 is flagged by
  # GHSA-67mh-4wv8-2f99, so it gets the version drizzle-kit itself runs.
  "@esbuild-kit/core-utils>esbuild": 0.25.12
