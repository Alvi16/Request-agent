name: request-agent

services:
  postgres:
    # PostgreSQL 18 with the pgvector extension, pinned by tag and digest.
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
    environment:
      POSTGRES_USER: request_agent
      POSTGRES_DB: request_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      # Bound to localhost only, so the database is never reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Since PostgreSQL 18, the image stores its data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U request_agent -d request_agent"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  mail:
    # Local mail server (SMTP and IMAP) standing for the agent's mailbox, so the email channel runs
    # and is tested without any real account. Mail stays in memory and is lost on restart.
    # The image contains no tool to probe the ports, so it has no health check: clients retry.
    image: greenmail/standalone:2.1.15@sha256:309ba544ea482e5d4265d09921cdab07c8dad2cc4481d715c9b8ff5d3f0a149f
    environment:
      # Two mailboxes: the agent's, and a separate one emptied by the tests. The agent's has its own
      # LOCAL_MAIL_ settings, never the EMAIL_ ones, which may hold the password of a real mailbox.
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=${LOCAL_MAIL_USER:-agent}:${LOCAL_MAIL_PASSWORD:?LOCAL_MAIL_PASSWORD must be set in .env}@requests.example,${TEST_EMAIL_USER:-agent-test}:${TEST_EMAIL_PASSWORD:?TEST_EMAIL_PASSWORD must be set in .env}@requests.example
    ports:
      # Bound to localhost only, like the database. Not the EMAIL_ ports of the agent, which may point
      # to a real mailbox such as Gmail while the tests keep using this server.
      - "127.0.0.1:${LOCAL_MAIL_SMTP_PORT:-3025}:3025"
      - "127.0.0.1:${LOCAL_MAIL_IMAP_PORT:-3143}:3143"
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

volumes:
  postgres-data:
